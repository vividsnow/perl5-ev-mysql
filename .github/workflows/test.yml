name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Install system build dependencies
        run: |
          if ! dpkg -s libmysqlclient-dev build-essential pkg-config libssl-dev zlib1g-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-upgrade libmysqlclient-dev build-essential pkg-config libssl-dev zlib1g-dev
          fi

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install Perl dependencies
        run: cpanm --notest EV Alien::MySQL Test::More

      - name: Configure and build
        run: |
          perl Makefile.PL
          make

      - name: Run tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: 3306
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ''
          TEST_MYSQL_DB: test
        run: prove -b t

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install dependencies
        run: |
          brew install mysql pkgconf cmake openssl@3
          brew services start mysql
          MYSQL_BIN="$(brew --prefix mysql)/bin"
          for i in $(seq 1 30); do "$MYSQL_BIN/mysqladmin" -u root ping >/dev/null 2>&1 && break || sleep 1; done
          "$MYSQL_BIN/mysql" -u root -e "create database if not exists test"
          export PKG_CONFIG_PATH="$(brew --prefix mysql)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LIBRARY_PATH="$(brew --prefix openssl@3)/lib:${LIBRARY_PATH:-}"
          cpanm --notest EV Alien::MySQL Test::More

      - name: Configure, build, and test
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: 3306
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: ''
          TEST_MYSQL_DB: test
        run: |
          perl Makefile.PL
          make
          prove -b t
